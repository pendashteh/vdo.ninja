			</div>

		<script>
			function showCameraModal() {
				// Move the original content into the modal before showing it
				const container3 = document.getElementById('container-3');
				const modalContent = document.getElementById('camera-setup-content');
				if (container3) {
					// Prepend to keep the close button functional
					modalContent.prepend(container3);
					container3.style.display = 'block';
					container3.classList.remove('hidden', 'card', 'pointer', 'columnfade', 'column'); // remove classes that might hide it
				}
				document.getElementById('camera-setup-modal').classList.remove('hidden');
				// Trigger the original function to start the camera preview
				previewWebcam();
			}

			function hideCameraModal() {
				document.getElementById('camera-setup-modal').classList.add('hidden');
				// Optional: stop camera streams if user closes modal
				try {
					hangup();
				} catch(e) { console.log('No active call to hang up.'); }
			}
		</script>
