<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDO.Ninja Simple Join/Share</title>
    <!--
        Tailwind CSS CDN is used here to provide modern, responsive styling
        directly through classes applied to HTML elements. This approach
        keeps styling "inline" with the HTML structure without external
        CSS files, fulfilling the request for inline styling while
        maintaining readability and responsiveness.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /*
            Set the default font for the entire body to 'Inter'.
            This ensures a consistent and modern typography across the page.
        */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="
    bg-gradient-to-br from-blue-500 to-purple-600 /* Creates a visually appealing background gradient */
    min-h-screen /* Ensures the body takes at least the full height of the viewport */
    flex /* Enables flexbox for centering content */
    items-center /* Vertically centers flex items */
    justify-center /* Horizontally centers flex items */
    p-4 /* Adds padding around the main content for spacing on smaller screens */
">
    <div class="
        bg-white /* White background for the main content card */
        p-8 /* Ample padding inside the card */
        rounded-xl /* Large rounded corners for a modern look */
        shadow-2xl /* Deep shadow for a floating, elevated effect */
        w-full /* Ensures the card takes full width on small screens */
        max-w-md /* Limits the maximum width for readability on larger screens */
        text-center /* Centers all text content within the card */
    ">
        <h1 class="
            text-4xl /* Large font size for the main title */
            font-bold /* Bold text for emphasis */
            text-gray-800 /* Dark gray color for good contrast */
            mb-6 /* Margin below the title */
        ">VDO.Ninja</h1>
        <p class="
            text-gray-600 /* Slightly lighter gray for descriptive text */
            mb-8 /* Margin below the description */
        ">Quickly join a meeting or share your screen.</p>

        <div class="mb-6">
            <input type="text" id="roomIdInput" placeholder="Enter Room ID"
                   class="
                       w-full /* Input takes full width */
                       p-4 /* Padding inside the input field */
                       border border-gray-300 /* Subtle border */
                       rounded-lg /* Rounded corners for the input */
                       focus:outline-none /* Removes default focus outline */
                       focus:ring-2 focus:ring-blue-500 /* Blue ring on focus for better UX */
                       text-lg /* Larger text within the input for readability */
                   ">
        </div>

        <div class="space-y-4">
            <button id="joinButton"
                    class="
                        w-full /* Button takes full width */
                        bg-blue-600 /* Primary blue background color */
                        text-white /* White text color */
                        p-4 /* Ample padding inside the button */
                        rounded-lg /* Rounded corners for the button */
                        text-xl /* Large font size for button text */
                        font-semibold /* Semi-bold text */
                        hover:bg-blue-700 /* Darker blue on hover */
                        transition-all duration-300 /* Smooth transition for hover effects */
                        transform hover:scale-105 /* Slight scale-up on hover for interactivity */
                        shadow-lg /* Shadow for depth */
                    ">
                Join Meeting
            </button>
            <button id="shareButton"
                    class="
                        w-full /* Button takes full width */
                        bg-purple-600 /* Secondary purple background color */
                        text-white /* White text color */
                        p-4 /* Ample padding inside the button */
                        rounded-lg /* Rounded corners for the button */
                        text-xl /* Large font size for button text */
                        font-semibold /* Semi-bold text */
                        hover:bg-purple-700 /* Darker purple on hover */
                        transition-all duration-300 /* Smooth transition for hover effects */
                        transform hover:scale-105 /* Slight scale-up on hover for interactivity */
                        shadow-lg /* Shadow for depth */
                    ">
                Share Screen
            </button>
        </div>

        <!-- Message box for displaying feedback to the user -->
        <div id="messageBox" class="
            mt-8 /* Margin top to separate from buttons */
            p-4 /* Padding inside the message box */
            text-gray-700 /* Default text color for messages */
            rounded-lg /* Rounded corners */
            text-sm /* Smaller font size for messages */
            hidden /* Initially hidden, shown when messages are displayed */
        ">
            <!-- Messages will be displayed here dynamically by JavaScript -->
        </div>
    </div>

    <script>
        // Get references to the HTML elements
        const roomIdInput = document.getElementById('roomIdInput');
        const joinButton = document.getElementById('joinButton');
        const shareButton = document.getElementById('shareButton');
        const messageBox = document.getElementById('messageBox');

        /**
         * Displays a message in the message box with appropriate styling.
         * Instead of using 'alert()', this function provides a custom, non-blocking
         * way to show messages to the user within the page itself.
         * @param {string} message - The text message to display.
         * @param {string} type - The type of message: 'success', 'error', or 'info'.
         * This determines the background and text color of the box.
         */
        function showMessage(message, type = 'info') {
            // Set the message text
            messageBox.textContent = message;

            // Remove all previous styling classes to ensure only the current type's styles are applied
            messageBox.classList.remove(
                'hidden', 'bg-green-100', 'text-green-800',
                'bg-red-100', 'text-red-800',
                'bg-gray-100', 'text-gray-700'
            );

            // Apply specific styling based on the message type
            if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'text-green-800'); // Green for success
            } else if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-800');     // Red for errors
            } else {
                messageBox.classList.add('bg-gray-100', 'text-gray-700');   // Gray for general info
            }

            // Make the message box visible
            messageBox.classList.remove('hidden');
        }

        /**
         * Hides the message box and clears its content.
         */
        function hideMessageBox() {
            messageBox.classList.add('hidden'); // Add 'hidden' class to hide the element
            messageBox.textContent = ''; // Clear any existing text
        }

        // Event listener for the "Join Meeting" button
        joinButton.addEventListener('click', () => {
            const roomId = roomIdInput.value.trim(); // Get and trim the room ID from the input field
            if (roomId) {
                // Display an informational message indicating the action
                showMessage(`Attempting to join room: ${roomId}`, 'info');

                // Simulate a network delay for a more realistic user experience.
                // In a real VDO.Ninja application, this would be replaced with actual
                // WebRTC connection setup and joining logic, potentially redirecting
                // to a specific URL like `https://vdo.ninja/?view=${roomId}`.
                setTimeout(() => {
                    showMessage(`Successfully joined room: ${roomId} (simulated)`, 'success');
                    // Example of what would happen in a real app:
                    // window.location.href = `https://vdo.ninja/?view=${roomId}`;
                }, 1500); // Simulate a 1.5-second delay
            } else {
                // If no room ID is entered, display an error message
                showMessage('Please enter a Room ID to join.', 'error');
            }
        });

        // Event listener for the "Share Screen" button
        shareButton.addEventListener('click', () => {
            const roomId = roomIdInput.value.trim(); // Get and trim the room ID from the input field
            // Screen sharing often requires a target room ID.
            if (roomId) {
                // Display an informational message indicating the action
                showMessage(`Attempting to share screen to room: ${roomId}`, 'info');

                // Simulate a network delay for a more realistic user experience.
                // In a real VDO.Ninja application, this would involve WebRTC
                // screen capture and streaming logic, potentially redirecting
                // to a URL like `https://vdo.ninja/?push=${roomId}&screenshare`.
                setTimeout(() => {
                    showMessage(`Screen sharing initiated for room: ${roomId} (simulated)`, 'success');
                    // Example of what would happen in a real app:
                    // window.location.href = `https://vdo.ninja/?push=${roomId}&screenshare`;
                }, 1500); // Simulate a 1.5-second delay
            } else {
                 // If no room ID is entered, display an error message
                 showMessage('Please enter a Room ID to share your screen.', 'error');
            }
        });
    </script>
</body>
</html>
